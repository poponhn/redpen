<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1f2937">
<title>RedPen</title>
<style>
:root{--bar:#1f2937;--bar2:#111827;--fg:#f9fafb;--acc:#e11d48;--line:#d1d5db}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#e5e7eb;color:#111}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;align-items:center;gap:2px;padding:2px 4px;background:var(--bar);color:var(--fg);overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.bar::-webkit-scrollbar{display:none}
#toolbar{background:var(--bar2)}
#tools,#colors{display:flex;gap:3px;align-items:center;flex:0 0 auto}
.bar button,.bar select{flex:0 0 auto;height:28px;min-width:28px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.bar button:hover{background:#374151}
.bar button.on{background:var(--acc)}
.bar button:disabled{opacity:.35;cursor:default}
.bar select{background:#374151;border-color:#4b5563}
.sep{width:1px;height:18px;background:#4b5563;margin:0 4px;flex:0 0 auto}
.brand{font-size:14px;font-weight:800;color:#fda4af;margin-right:6px;white-space:nowrap}
.sw{width:20px!important;min-width:20px!important;height:20px!important;padding:0!important;border-radius:50%!important;border:2px solid #ffffff55!important}
.sw.on{outline:2px solid #fff;outline-offset:2px}
#workspace{flex:1;display:flex;min-height:0;position:relative}
#panes{flex:1;display:grid;gap:4px;padding:4px;min-width:0;min-height:0}
#panes.l1{grid-template:1fr/1fr}
#panes.l2{grid-template:1fr/1fr 1fr}
#panes.l3{grid-template:1fr/1fr 1fr 1fr}
#panes.l4{grid-template:1fr 1fr/1fr 1fr}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;border:2px solid transparent;border-radius:7px;overflow:hidden;background:#6b7280}
.pane.active{border-color:var(--acc)}
.phead{display:flex;align-items:center;gap:3px;padding:2px 4px;background:#f3f4f6;border-bottom:1px solid var(--line);font-size:12px;flex:0 0 auto}
.phead select{flex:1;min-width:0;height:24px;border:1px solid var(--line);border-radius:5px;background:#fff;font:inherit}
.phead button{height:24px;min-width:24px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;font:inherit}
.pinfo,.zl{white-space:nowrap;color:#374151;padding:0 3px;font-variant-numeric:tabular-nums}
.scroller{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;width:max-content;min-width:100%}
.page{position:relative;background:#fff;box-shadow:0 1px 5px #0006;flex:0 0 auto}
.page canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.ov{touch-action:pan-x pan-y}
#panes.drawing .ov,#panes.grab .ov{touch-action:none}
#panes.drawing .ov{cursor:crosshair}
#panes.texting .ov{cursor:text}
.tl{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;-webkit-text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:3;display:none;pointer-events:none}
.tl span,.tl br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.tl span::selection{background:rgba(37,99,235,.35);color:transparent}
#panes.txsel .tl{display:block;pointer-events:auto;user-select:text;-webkit-user-select:text}
#panes.txsel .ov{pointer-events:none}
.empty{color:#f3f4f6;text-align:center;margin:auto;padding:40px 16px;line-height:1.7;font-size:16px}
.empty small{color:#d1d5db}
#sidebar{width:260px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;flex:0 0 auto}
#sidebar[hidden]{display:none}
.sbhead{padding:8px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;align-items:center}
.sbhead span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.sbhead button{border:0;background:none;font-size:18px;cursor:pointer}
.tabs{display:flex;gap:2px;flex:1;min-width:0}
.tabs button{flex:1;height:28px;border:1px solid var(--line);border-radius:5px;background:#f9fafb;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;padding:0 4px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tabbody[hidden]{display:none}
#tabProps,#tabChest{overflow:auto;padding:8px;font-size:13px;gap:8px}
.pf{display:grid;grid-template-columns:84px 1fr;gap:6px 8px;align-items:center}
.pf label{color:#4b5563}
.pf input[type=number],.pf select,.pf input[type=text],.pf textarea{width:100%;height:28px;border:1px solid var(--line);border-radius:5px;font:inherit;padding:0 6px;background:#fff}
.pf textarea{height:56px;padding:4px 6px;resize:vertical}
.pf input[type=color]{width:36px;height:28px;border:1px solid var(--line);border-radius:5px;padding:1px;background:#fff}
.pf input[type=range]{width:100%}
.pf .ro{color:#111;font-weight:600;word-break:break-word}
.prow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.psw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;outline:1px solid #d1d5db;cursor:pointer;padding:0}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtns button,.chbtns button{height:30px;border:1px solid var(--line);border-radius:5px;background:#fff;font:inherit;cursor:pointer;padding:0 8px}
.pbtns button.pri,.chbtns button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.pbtns button:disabled{opacity:.4;cursor:default}
.phint{color:#6b7280;line-height:1.5}
.ptitle{font-weight:700}
.chbtns{display:flex;flex-wrap:wrap;gap:6px}
.chitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px;cursor:pointer;background:#fff}
.chitem.on{outline:2px solid var(--acc)}
.chitem canvas{width:64px;height:44px;background:#fff;border:1px solid #eee;border-radius:4px;flex:0 0 auto}
.chitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chitem button{border:1px solid var(--line);background:#fff;border-radius:4px;min-width:26px;height:26px;cursor:pointer}
#thumbs{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:10px;background:#f3f4f6}
.th{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px;cursor:pointer}
.th canvas{width:100%;height:auto;display:block;min-height:50px;background:#fff}
.thbar{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:12px}
.thbar button{border:1px solid var(--line);background:#fff;border-radius:4px;min-width:26px;height:26px;cursor:pointer;padding:0 3px}
.insbox{padding:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px}
.insbox select,.insbox input,.insbox button{height:32px;border:1px solid var(--line);border-radius:5px;font:inherit;padding:0 6px;background:#fff}
.insbox button{background:var(--acc);color:#fff;border:0;cursor:pointer;font-weight:600}
.insbox button.alt{background:#374151}
#readbar{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;background:#111827dd;color:#fff;border-radius:24px;padding:4px 6px;gap:4px;align-items:center;box-shadow:0 2px 10px #0006}
#readbar button{background:none;border:0;color:#fff;font-size:18px;min-width:40px;height:40px;cursor:pointer;border-radius:20px}
#readbar span{min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
body.reading .bar,body.reading .phead,body.reading #sidebar{display:none!important}
body.reading #readbar{display:flex}
body.reading #panes{padding:0;gap:2px}
#mlist{flex:0 0 auto;height:30vh;min-height:90px;max-height:75vh;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;position:relative}
#mlist[hidden]{display:none}
#mlGrip{height:8px;cursor:ns-resize;background:#e5e7eb;touch-action:none;flex:0 0 auto;display:flex;justify-content:center;align-items:center}
#mlGrip::after{content:'';width:40px;height:3px;border-radius:2px;background:#9ca3af}
.mlhead{display:flex;align-items:center;gap:5px;padding:3px 6px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap;flex:0 0 auto}
.mlhead select,.mlhead input,.mlhead button{height:26px;border:1px solid var(--line);border-radius:5px;font:inherit;background:#fff;padding:0 6px}
.mlhead button{cursor:pointer}
.mlhead input{width:130px}
#mlCount{color:#6b7280}
.mlbody{flex:1;overflow:auto}
#mlTable{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
#mlTable th{position:sticky;top:0;background:#f3f4f6;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;z-index:1}
#mlTable td{padding:3px 6px;border-bottom:1px solid #eef0f3;vertical-align:middle}
#mlTable tr{cursor:pointer}
#mlTable tbody tr:hover{background:#f9fafb}
#mlTable tr.cur{background:#fee2e2}
#mlTable input.note{width:100%;min-width:180px;height:28px;border:1px solid var(--line);border-radius:4px;padding:0 6px;font:inherit}
#mlTable select{height:28px;border:1px solid var(--line);border-radius:4px;font:inherit}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.st-open{color:#b91c1c}.st-done{color:#15803d}.st-rej{color:#6b7280}
.mlempty{padding:16px;color:#6b7280;text-align:center}
body.reading #mlist{display:none!important}
#cmd{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 8px;background:#0b1220;color:#e5e7eb;font-family:ui-monospace,Consolas,monospace;font-size:13px;border-top:2px solid var(--acc);flex-wrap:wrap}
#cmd[hidden]{display:none}
#cmdMsg{white-space:pre-wrap}
#cmdMsg b{color:#fda4af}
#cmdIn{flex:1;min-width:140px;height:30px;background:#111827;color:#fff;border:1px solid #374151;border-radius:5px;padding:0 8px;font:inherit;font-size:16px}
#cmdIn[hidden]{display:none}
#cmdBtns{display:flex;gap:6px;flex-wrap:wrap}
#cmd button{height:30px;padding:0 12px;border-radius:5px;border:1px solid #374151;background:#1f2937;color:#fff;font:inherit;cursor:pointer}
#cmd button.pri{background:var(--acc);border-color:var(--acc)}
#cmdErr{color:#fca5a5;width:100%}
#cmdErr:empty{display:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#111827ee;color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#printArea{display:none}
@media (max-width:700px){
  .bar button,.bar select{height:32px;min-width:32px}
  #panes.l2{grid-template:1fr 1fr/1fr}
  .lbl{display:none}
  #sidebar{position:absolute;z-index:20;left:0;top:0;bottom:0;width:82%;box-shadow:4px 0 16px #0005}
}
@media print{
  html,body{height:auto;overflow:visible;display:block;background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:100%;height:auto;break-after:page;page-break-after:always}
  @page{margin:6mm}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header class="bar" id="topbar">
  <span class="brand">🖍️ RedPen</span>
  <button id="bOpen" title="Mở PDF (Ctrl+O)">📂<span class="lbl">Mở</span></button>
  <button id="bSave" title="Lưu PDF kèm markup (Ctrl+S)">💾<span class="lbl">Lưu</span></button>
  <button id="bPrint" title="In (Ctrl+P)">🖨️<span class="lbl">In</span></button>
  <span class="sep"></span>
  <button id="bUndo" title="Hoàn tác (Ctrl+Z)">↶</button>
  <button id="bRedo" title="Làm lại (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <select id="layoutSel" title="Chia màn hình">
    <option value="1">▣ 1 ô</option><option value="2">◫ 2 ô</option><option value="3">▥ 3 ô</option><option value="4">⊞ 4 ô</option>
  </select>
  <button id="bSync" title="Đồng bộ cuộn và zoom giữa các ô">🔗<span class="lbl">Đồng bộ</span></button>
  <button id="bPages" title="Bảng bên: Trang · Thuộc tính · Tool Chest">◧<span class="lbl">Panel</span></button>
  <button id="bList" title="Danh sách markup / comment (M)">💬<span class="lbl">Markups</span></button>
  <button id="bRead" title="Chế độ đọc toàn màn hình (F)">⛶<span class="lbl">Đọc</span></button>
  <button id="bAbout" title="Giới thiệu">ℹ️</button>
</header>
<div class="bar" id="toolbar">
  <span id="tools"></span>
  <span class="sep"></span>
  <span id="colors"></span>
  <select id="wsel" title="Độ dày nét / cỡ chữ">
    <option value="1">Mảnh</option><option value="2" selected>Vừa</option><option value="3">Dày</option><option value="5">Rất dày</option>
  </select>
  <button id="bDel" title="Xóa markup đang chọn (Delete)" disabled>🗑<span class="lbl">Xóa</span></button>
</div>
<main id="workspace">
  <aside id="sidebar" hidden>
    <div class="sbhead"><div class="tabs"><button data-tab="pages">📑 Trang</button><button data-tab="props">🎛 Thuộc tính</button><button data-tab="chest">🧰 Tool Chest</button></div><button id="sbClose" title="Đóng">✕</button></div>
    <div class="tabbody" id="tabPages">
      <div style="padding:4px 8px;font-size:12px;color:#4b5563;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="sbTitle"></div>
      <div id="thumbs"></div>
      <div class="insbox">
        <b>Chèn trang từ file khác</b>
        <select id="insSrc" title="Lấy trang từ file"></select>
        <input id="insRange" placeholder="Trang, vd: 1-3,5 (trống = tất cả)">
        <select id="insPos">
          <option value="after">Sau trang đang xem</option>
          <option value="start">Đầu file</option>
          <option value="end">Cuối file</option>
        </select>
        <button id="insBtn">➕ Chèn vào file đang xem</button>
        <button id="newBtn" class="alt">📄 Tách thành file mới</button>
      </div>
    </div>
    <div class="tabbody" id="tabProps" hidden></div>
    <div class="tabbody" id="tabChest" hidden></div>
  </aside>
  <div id="panes" class="l1"></div>
</main>
<section id="mlist" hidden>
  <div id="mlGrip" title="Kéo để chỉnh chiều cao"></div>
  <div class="mlhead">
    <b>💬 Markups</b><span id="mlCount"></span>
    <select id="mlFilter" title="Phạm vi"><option value="all">Tất cả trang</option><option value="page">Trang đang xem</option></select>
    <select id="mlStFilter" title="Lọc trạng thái"><option value="">Mọi trạng thái</option><option value="open">Mở</option><option value="done">Đã xử lý</option><option value="rej">Không xử lý</option></select>
    <input id="mlSearch" placeholder="🔍 Tìm…">
    <button id="mlAuthor" title="Tên người review">👤</button>
    <button id="mlCsv" title="Xuất comment sheet ra Excel (CSV)">⬇ Excel</button>
    <button id="mlClose" title="Đóng">✕</button>
  </div>
  <div class="mlbody"><table id="mlTable"><thead><tr><th>#</th><th>Trang</th><th>Loại</th><th>Màu</th><th>Nội dung / Số đo</th><th>Comment</th><th>Trạng thái</th><th>Người tạo</th><th>Thời gian</th></tr></thead><tbody id="mlRows"></tbody></table></div>
</section>
<div id="cmd" hidden><span id="cmdMsg"></span><input id="cmdIn" autocomplete="off" hidden><span id="cmdBtns"></span><button id="cmdX" title="Hủy (Esc)">✕</button><div id="cmdErr"></div></div>
<div id="readbar"><button id="rPrev" title="Trang trước">◀</button><span id="rInfo"></span><button id="rNext" title="Trang sau">▶</button><button id="rExit" title="Thoát chế độ đọc">✕</button></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="chestFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   RedPen v1.5.0 — công cụ markup PDF offline cá nhân
   Thư viện: PDF.js (Apache-2.0, Mozilla) · pdf-lib (MIT, Andrew Dillon)
   ========================================================= */
const $ = s => document.querySelector(s);
const PDFJS_V = '3.11.174';
const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_V}/`;

if (!window.pdfjsLib || !window.PDFLib) {
  document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif">Không tải được thư viện PDF. Lần đầu mở app cần có mạng, bạn kiểm tra kết nối rồi tải lại trang nhé.</div>';
  throw new Error('libs missing');
}
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
const workerReady = (async () => {
  try {
    const r = await fetch(PDFJS_BASE + 'pdf.worker.min.js'); if (!r.ok) return;
    const url = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
    pdfjsLib.GlobalWorkerOptions.workerSrc = url;
  } catch (e) { console.warn('worker blob', e); }
})();
const { PDFDocument, rgb, degrees, LineCapStyle } = PDFLib;

const COARSE = matchMedia('(pointer:coarse)').matches;
const HL = '#facc15';
const COLORS = ['#e11d48', '#2563eb', '#16a34a', '#111827', '#f97316', '#9333ea'];
const TOOLS = [
  { t: 'select', i: '↖', l: 'Chọn', k: 'v' },
  { t: 'pen', i: '✎', l: 'Bút', k: 'p' },
  { t: 'line', i: '╱', l: 'Đường', k: 'l' },
  { t: 'arrow', i: '➜', l: 'Mũi tên', k: 'a' },
  { t: 'rect', i: '▭', l: 'Chữ nhật', k: 'r' },
  { t: 'ellipse', i: '◯', l: 'Elip', k: 'e' },
  { t: 'cloud', i: '☁', l: 'Cloud', k: 'c' },
  { t: 'highlight', i: '▮', l: 'Tô sáng', k: 'h' },
  { t: 'text', i: 'T', l: 'Chữ', k: 't' },
  { t: 'tsel', i: '⌶', l: 'Chọn chữ', k: 'x' },
  { t: 'mlen', i: '↔', l: 'Đo dài', k: 'd' },
  { t: 'marea', i: '⬠', l: 'Diện tích', k: 'g' },
  { t: 'mcount', i: '⊕', l: 'Đếm', k: 'n' },
  { t: 'calib', i: '', l: 'Hiệu chỉnh', k: '', hidden: true },
  { t: 'stamp', i: '', l: 'Tool Chest', k: '', hidden: true },
];
const MEAS = ['mlen', 'marea', 'mcount'];
const PT_MM = 25.4 / 72;

const S = { sources: {}, docs: [], panes: [], active: 0, tool: 'select', color: COLORS[0], width: 2,
  sync: false, layout: 1, undo: [], redo: [], sel: null, reading: false, author: '', poly: null, multi: false, tab: 'pages', chest: [], stamp: null, clip: null };
try { S.author = localStorage.getItem('redpen_author') || ''; } catch (e) {}
let uid = 1;
const newId = () => uid++;
let drag = null;
const touchPtrs = new Set();

/* ---------- tiện ích ---------- */
function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); if (ms) t._h = setTimeout(() => t.classList.remove('show'), ms);
}
/* ---------- command line kiểu CAD ---------- */
const CMD = { res: null, onCancel: null };
function cmdEnd(v) {
  const r = CMD.res, oc = CMD.onCancel; CMD.res = null; CMD.onCancel = null;
  $('#cmd').hidden = true; $('#cmdIn').hidden = true; $('#cmdIn').blur(); $('#cmdBtns').innerHTML = ''; $('#cmdErr').textContent = '';
  if (v === null && oc) oc();
  if (r) r(v);
}
function cmdOpen(msg) {
  if (CMD.res || CMD.onCancel) cmdEnd(null);
  $('#cmdMsg').innerHTML = msg; $('#cmdErr').textContent = ''; $('#cmd').hidden = false;
}
// hỏi nhập giá trị → Promise<string|null>
function cmdAsk(msg, o = {}) {
  cmdOpen(msg);
  const inp = $('#cmdIn'); inp.hidden = false; inp.type = o.type || 'text';
  inp.value = o.value || ''; inp.placeholder = o.placeholder || '';
  $('#cmdBtns').innerHTML = '<button class="pri" data-v="ok">OK ⏎</button>';
  if (o.err) $('#cmdErr').textContent = o.err;
  setTimeout(() => { inp.focus(); inp.select(); }, 30);
  return new Promise(r => { CMD.res = r; CMD.ask = true; });
}
// chọn phương án → Promise<value|null>
function cmdChoose(msg, opts) {

  try { return await pdfjsLib.getDocument({ data: bytes.slice(), ...opts }).promise; }
  catch (e) {
    if (e && e.name === 'PasswordException') {
      const pw = await cmdAsk('<b>MỞ FILE</b> › File có mật khẩu, nhập mật khẩu:', { type: 'password' });
      if (pw === null) throw new Error('Đã hủy');

async function openFiles(files) {
  const list = [...files].filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!list.length) return toast('Chỉ mở được file PDF');
  for (const f of list) {
    try {
      toast(`Đang mở ${f.name}…`, 0);
      const bytes = new Uint8Array(await f.arrayBuffer());
      const pdf = await loadPdf(bytes);
      const src = { id: newId(), name: f.name, bytes, pdf, cache: {}, sizes: [] };
      const pg0 = await getProxy(src, 0), vp0 = pg0.getViewport({ scale: 1, rotation: 0 });
      for (let k = 0; k < pdf.numPages; k++) src.sizes[k] = { w: vp0.width, h: vp0.height, rotate: pg0.rotate || 0, est: k > 0 };

      const doc = { id: newId(), name: f.name, pages: src.sizes.map((_, k) => ({ src: src.id, idx: k, rot: 0, annots: [] })), dirty: false };

}
function loadChest() {
  try { const v = JSON.parse(localStorage.getItem(CHEST_KEY) || 'null'); if (Array.isArray(v)) return v; } catch (e) {}
  return chestDefaults();
}
function saveChest() { try { localStorage.setItem(CHEST_KEY, JSON.stringify(S.chest)); } catch (e) { toast('Không lưu được Tool Chest vào trình duyệt'); } }
// mẫu: toạ độ tương đối quanh tâm khung bao
function makeTemplate(annots) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  annots.forEach(a => geomPts(a).forEach(q => { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return annots.map(a => {
    const c = JSON.parse(JSON.stringify(a));
    ['id', 'g', 'status', 'author', 'created', 'n'].forEach(k => delete c[k]);
    c.pts = c.pts.map(q => [q[0] - cx, q[1] - cy]);
    return c;
  });
}
function instantiate(items, at, startN, preview, group = true) {
  const g = group && items.length > 1 ? newId() : null;
  let n = startN || 0;
  return items.map(t => {
    const a = JSON.parse(JSON.stringify(t));
    a.pts = a.pts.map(q => [q[0] + at[0], q[1] + at[1]]);
    if (!preview) { a.id = newId(); a.status = 'open'; a.author = S.author; a.created = Date.now(); if (a.note == null) a.note = ''; if (g) a.g = g; }
    if (a.type === 'mcount') a.n = ++n;
    if (preview) a.op = (a.op == null ? 1 : a.op) * 0.5;
    return a;
  });
}
function maxCount(doc) { let n = 0; doc.pages.forEach(pg => pg.annots.forEach(x => { if (x.type === 'mcount') n = Math.max(n, x.n || 0); })); return n; }
function placeItems(doc, i, at, items, group = true) {
  const before = snap(doc), made = instantiate(items, at, maxCount(doc), false, group);
  doc.pages[i].annots.push(...made);
  commit(doc, before); redrawDocPage(doc.id, i);
  return made;
}
async function addSelToChest() {
  const list = selAnnots(); if (!list.length) return toast('Chọn markup trước đã');
  const def = list.length === 1 ? (list[0].type === 'text' ? list[0].text : TYPE_LBL[list[0].type]) : list.map(a => a.type === 'text' ? a.text : '').filter(Boolean).join(' ') || `Nhóm ${list.length} markup`;
  const name = await cmdAsk('<b>TOOL CHEST</b> › Đặt tên cho mục mới:', { value: String(def).slice(0, 40) });
  if (name === null) return;
  S.chest.push({ id: 'c' + Date.now(), name: name.trim() || def, items: makeTemplate(list) });
  saveChest(); toast('Đã thêm vào Tool Chest ⭐');
  if (!$('#sidebar').hidden && S.tab === 'chest') renderChest();
}
function previewItems(cv, items) {
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  items.forEach(a => { geomPts(a).forEach(q => { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); });
    if (a.type === 'text') { x1 = Math.max(x1, a.pts[0][0] + a.size * 0.6 * String(a.text).length); y0 = Math.min(y0, a.pts[0][1] - a.size * 1.3); } });
  const k = Math.min((W - 8) / Math.max(x1 - x0, 1), (H - 8) / Math.max(y1 - y0, 1));
  const ox = (W - (x1 - x0) * k) / 2, oy = (H - (y1 - y0) * k) / 2;
  const vp = { scale: k, convertToViewportPoint: (x, y) => [ox + (x - x0) * k, oy + (y1 - y) * k] };
  items.forEach(a => drawAnnot(ctx, vp, { ...a, n: a.n || 1 }, null));
}
function renderChest() {
  const box = $('#tabChest'); if (!box || $('#sidebar').hidden || S.tab !== 'chest') return;
  box.innerHTML = `<div class="phint">Chạm một mục rồi chạm lên bản vẽ để đặt (đặt được nhiều lần). Esc để thôi.</div>
    <div class="chbtns"><button class="pri" id="chAdd">➕ Thêm vùng chọn</button><button id="chExp">⬇ Xuất</button><button id="chImp">⬆ Nhập</button></div>
    <div id="chList" style="display:flex;flex-direction:column;gap:6px"></div>`;
  const L = $('#chList');
  if (!S.chest.length) L.innerHTML = '<div class="phint">Thư viện trống.</div>';
  S.chest.forEach(it => {
    const d = document.createElement('div'); d.className = 'chitem' + (S.stamp && S.stamp.id === it.id ? ' on' : ''); d.dataset.id = it.id;
    d.innerHTML = `<canvas width="128" height="88"></canvas><span title="${esc(it.name)}">${esc(it.name)}</span><button data-a="ren" title="Đổi tên">✎</button><button data-a="del" title="Xóa khỏi thư viện">🗑</button>`;
    L.appendChild(d); previewItems(d.querySelector('canvas'), it.items);
  });
  $('#chAdd').onclick = addSelToChest;
  $('#chExp').onclick = () => deliver(new TextEncoder().encode(JSON.stringify({ app: 'RedPen', chest: S.chest }, null, 1)), 'redpen-toolchest.json', 'application/json');
  $('#chImp').onclick = () => $('#chestFile').click();
}
async function onChestClick(e) {
  const it = e.target.closest('.chitem'); if (!it) return;
  const item = S.chest.find(x => x.id === it.dataset.id); if (!item) return;
  const a = e.target.dataset.a;
  if (a === 'del') {
    if (!(await cmdConfirm(`<b>TOOL CHEST</b> › Xóa "${esc(item.name)}" khỏi thư viện?`, 'Xóa', 'Hủy'))) return;
    S.chest = S.chest.filter(x => x !== item); saveChest(); if (S.stamp === item) setTool('select'); renderChest(); return;
  }
  if (a === 'ren') {
    const n = await cmdAsk('<b>TOOL CHEST</b> › Tên mới:', { value: item.name }); if (n === null || !n.trim()) return;
    item.name = n.trim(); saveChest(); renderChest(); return;
  }
  if (!activeDoc()) return toast('Mở file PDF trước đã');
  CMD.onCancel = null;
  setTool('stamp'); S.stamp = item; renderChest();
  cmdInfo(`<b>TOOL CHEST</b> › Chạm lên bản vẽ để đặt "${esc(item.name)}". Esc để thôi.`, () => { if (S.tool === 'stamp') setTool('select'); });
  if (innerWidth <= 700) toggleSidebar(false);
}
async function importChest(file) {
  try {
    const v = JSON.parse(await file.text()), arr = Array.isArray(v) ? v : v.chest;
    if (!Array.isArray(arr)) throw new Error('Sai định dạng');
    let n = 0;
    arr.forEach(it => { if (it && it.name && Array.isArray(it.items)) { S.chest.push({ id: 'c' + Date.now() + '_' + (n++), name: it.name, items: it.items }); } });
    saveChest(); renderChest(); toast(`Đã nhập ${n} mục vào Tool Chest`);
  } catch (e) { toast('Không đọc được file thư viện: ' + e.message, 4000); }
}
// copy / paste markup
function copySel() {
  const list = selAnnots(); if (!list.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  list.forEach(a => geomPts(a).forEach(q => { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }));
  S.clip = { items: makeTemplate(list), at: [(x0 + x1) / 2, (y0 + y1) / 2], grouped: list.length > 1 && list.every(a => a.g && a.g === list[0].g) };
  toast(`Đã copy ${list.length} markup`);
}
function pasteClip() {
  if (!S.clip) return;
  const p = activePane(), doc = activeDoc(); if (!doc) return;
  S.clip.at = [S.clip.at[0] + 10, S.clip.at[1] - 10];
  const made = placeItems(doc, p.curPage, S.clip.at, S.clip.items, S.clip.grouped);
  if (S.tool !== 'select') setTool('select');
  setSel({ docId: doc.id, i: p.curPage, ids: made.map(a => a.id) });
}

/* ---------- gắn sự kiện ---------- */
window.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') touchPtrs.add(e.pointerId); }, true);
const dropPtr = e => touchPtrs.delete(e.pointerId);
window.addEventListener('pointerup', dropPtr, true); window.addEventListener('pointercancel', dropPtr, true);

$('#bOpen').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { openFiles(e.target.files); e.target.value = ''; };
$('#bSave').onclick = saveDoc;
$('#bPrint').onclick = printDoc;
$('#bUndo').onclick = undo;
$('#bRedo').onclick = redo;
$('#bDel').onclick = delSel;
$('#bPages').onclick = () => toggleSidebar();
$('#sbClose').onclick = () => toggleSidebar(false);
$('#thumbs').onclick = onThumbClick;
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); };
$('#tabChest').addEventListener('click', onChestClick);
$('#chestFile').onchange = e => { if (e.target.files[0]) importChest(e.target.files[0]); e.target.value = ''; };
$('#insBtn').onclick = insertPages;
$('#newBtn').onclick = splitToNew;
$('#bRead').onclick = () => setReading(!S.reading);
$('#rExit').onclick = () => setReading(false);
$('#rPrev').onclick = () => goPage(-1);
$('#rNext').onclick = () => goPage(1);
$('#bSync').onclick = () => {
  S.sync = !S.sync; $('#bSync').classList.toggle('on', S.sync);
  if (S.sync) { const p = activePane(); S.panes.forEach(o => { if (o !== p && p.scale) setScale(o, p.scale, { fromSync: true }); }); syncFrom(p); toast('Đã bật đồng bộ cuộn và zoom'); }
  else toast('Đã tắt đồng bộ');
};
$('#layoutSel').onchange = e => { S.layout = +e.target.value; renderLayout(); };
$('#bAbout').onclick = () => cmdChoose('RedPen v1.5.0\nCông cụ markup PDF offline cá nhân.\n\nFile PDF chỉ được xử lý trên máy của bạn, không gửi đi đâu.\n\nThư viện sử dụng:\n• PDF.js — Mozilla, giấy phép Apache-2.0\n• pdf-lib — Andrew Dillon, giấy phép MIT\n\nPhím tắt: V chọn · X chọn chữ (bôi đen rồi Ctrl+C) · P bút · L đường · A mũi tên · R chữ nhật · E elip · C cloud · H tô sáng · T chữ · D đo dài · G diện tích (Enter để kết thúc) · N đếm\nShift+click / kéo khung: chọn nhiều · Ctrl+A chọn hết trang · Ctrl+G group · Ctrl+Shift+G bỏ group · Ctrl+C/V copy dán\nCtrl+Z/Y hoàn tác/làm lại · Delete xóa · +/− zoom · M danh sách markup · F đọc toàn màn hình · ←/→ lật trang', [{ l: 'Đóng', v: 1 }]);

window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (mod && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (mod && k === 's') { e.preventDefault(); saveDoc(); return; }
  if (mod && k === 'o') { e.preventDefault(); $('#fileInput').click(); return; }
  if (mod && k === 'p') { e.preventDefault(); printDoc(); return; }
  if (mod && k === 'a') { e.preventDefault(); if (S.tool === 'tsel') { const p = activePane(), el = p && p.pageEls[p.curPage || 0], t = el && el.querySelector('.tl'); if (t) { const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } return; } selectAllPage(); return; }
  if (mod && k === 'g') { e.preventDefault(); groupSel(!e.shiftKey); return; }
  if (mod && k === 'c') { if (S.tool === 'tsel') return; if (S.sel) { e.preventDefault(); copySel(); } return; }
  if (mod && k === 'v') { if (S.clip) { e.preventDefault(); pasteClip(); } return; }
  if (mod) return;
  if (k === 'delete' || k === 'backspace') { if (S.sel) { e.preventDefault(); delSel(); } return; }
  if (k === 'escape' && cmdActive()) { cmdEnd(null); return; }
  if (k === 'enter' && S.poly) { e.preventDefault(); finishPoly(); return; }
  if (k === 'escape' && S.poly) { finishPoly(true); return; }
  if (k === 'escape') { if (S.sel) setSel(null); else if (S.reading) setReading(false); return; }
  if (k === 'f') { setReading(!S.reading); return; }
  if (k === 'm') { toggleMlist(); return; }
  if (k === 'arrowright' || k === 'pagedown') { if (S.reading || k === 'pagedown') { e.preventDefault(); goPage(1); } return; }
  if (k === 'arrowleft' || k === 'pageup') { if (S.reading || k === 'pageup') { e.preventDefault(); goPage(-1); } return; }
  const p = activePane();
  if ((k === '+' || k === '=') && p) { setScale(p, p.scale * 1.25); return; }
  if ((k === '-' || k === '_') && p) { setScale(p, p.scale / 1.25); return; }
  const tool = TOOLS.find(x => x.k && x.k === k); if (tool) setTool(tool.t);
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) openFiles(e.dataTransfer.files); });
window.addEventListener('beforeunload', e => { if (S.docs.some(d => d.dirty)) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- khởi động ---------- */
S.chest = loadChest();
buildToolbar();
if (innerWidth <= 700) { [...$('#layoutSel').options].forEach(o => { if (+o.value > 2) o.disabled = true; }); }
S.panes = [newPane(null)];
renderLayout();
setTool('select');
</script>
</body>
</html>
